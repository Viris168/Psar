# Production: every secret comes from environment variables. No defaults for secrets here.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  jwt:
    secret: ${JWT_SECRET}
  storage:
    cloudinary-url: ${CLOUDINARY_URL}
  payment:
    khqr:
      account-id: ${KHQR_MERCHANT_ID}
    bakong:
      mode: ${BAKONG_MODE:bakong}
      token: ${BAKONG_API_TOKEN}
    webhook:
      secret: ${PAYMENT_WEBHOOK_SECRET}
    simulate:
      enabled: ${PAYMENT_SIMULATE_ENABLED:false}   # true only for the public demo
    folder: ${STORAGE_FOLDER:psar}

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}   # keep on for the portfolio demo

logging:
  level:
    root: INFO
    com.psar: INFO
