# Production: every secret comes from environment variables. No defaults for secrets here.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  jwt:
    secret: ${JWT_SECRET}

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}   # keep on for the portfolio demo

logging:
  level:
    root: INFO
    com.psar: INFO
