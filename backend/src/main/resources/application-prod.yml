# Production: every secret comes from environment variables. No defaults for secrets here.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  jwt:
    secret: ${JWT_SECRET}
  storage:
    endpoint: ${STORAGE_ENDPOINT}
    bucket: ${STORAGE_BUCKET}
    access-key: ${STORAGE_ACCESS_KEY}
    secret-key: ${STORAGE_SECRET_KEY}
    public-url: ${STORAGE_PUBLIC_URL}

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}   # keep on for the portfolio demo

logging:
  level:
    root: INFO
    com.psar: INFO
