spring:
  application:
    name: psar
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/psar}
    username: ${DB_USERNAME:psar}
    password: ${DB_PASSWORD:psar}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway - never change this
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  data:
    web:
      pageable:
        max-page-size: 100

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:change-me-in-env-this-must-be-at-least-32-bytes-long}
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
  order:
    payment-timeout: PT15M
  shop:
    # Where CITY deliveries start; the fee depends on the distance from here (default: Phnom Penh centre)
    latitude: ${SHOP_LATITUDE:11.5564}
    longitude: ${SHOP_LONGITUDE:104.9282}
  delivery:
    # CITY fee bands: the first band whose max-km is above the distance wins (max-km is exclusive);
    # the last band has no max-km. PROVINCE uses the delivery company's base fee.
    city-bands:
      - max-km: 5
        fee: 1.00
      - max-km: 15
        fee: 2.00
      - fee: 3.00
  scheduling:
    enabled: ${SCHEDULING_ENABLED:true}   # @Scheduled jobs (with ShedLock); off in tests
  storage:
    # cloudinary://<api-key>:<api-secret>@<cloud-name> (Cloudinary console → API Keys). Empty: the app
    # still starts, only uploads fail.
    cloudinary-url: ${CLOUDINARY_URL:}
    folder: ${STORAGE_FOLDER:psar-dev}         # root folder in Cloudinary, so dev and prod files stay apart

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
