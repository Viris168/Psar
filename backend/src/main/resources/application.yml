spring:
  application:
    name: psar
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/psar}
    username: ${DB_USERNAME:psar}
    password: ${DB_PASSWORD:psar}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway - never change this
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  data:
    web:
      pageable:
        max-page-size: 100

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:change-me-in-env-this-must-be-at-least-32-bytes-long}
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
  order:
    payment-timeout: PT15M
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    bucket: ${STORAGE_BUCKET:psar}
    access-key: ${STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${STORAGE_SECRET_KEY:minioadmin}
    region: ${STORAGE_REGION:us-east-1}       # "auto" for Cloudflare R2
    # base URL that clients load files from (bucket URL or CDN), file URL = public-url + "/" + key
    public-url: ${STORAGE_PUBLIC_URL:${app.storage.endpoint}/${app.storage.bucket}}
    create-bucket: false                      # dev only: create the bucket (public read) on startup

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
