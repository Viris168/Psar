# Local development stack.
#   Infra only (run backend/frontend from your IDE):  docker compose up -d postgres rabbitmq
#   Everything:                                        docker compose up --build
#   Reset all data (dev only):                         docker compose down -v

services:
  postgres:
    image: pgvector/pgvector:pg16          # PostgreSQL + pgvector for the AI phase
    environment:
      POSTGRES_DB: psar
      POSTGRES_USER: ${DB_USERNAME:-psar}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-psar}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-psar} -d psar"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management           # used from Phase 9; UI at http://localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-psar}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-psar}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/psar
      DB_USERNAME: ${DB_USERNAME:-psar}
      DB_PASSWORD: ${DB_PASSWORD:-psar}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-env-this-must-be-at-least-32-bytes-long}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}    # files are stored on Cloudinary (no local container)
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres-data:
  rabbitmq-data:
